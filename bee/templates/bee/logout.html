{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spellcasting – Logged Out</title>
  
  <link rel="manifest" href="{% url 'manifest.json' %}">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-title" content="Spellcasting">

  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600&family=Raleway:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:      #C8972A;
      --gold-lt:   #E8B84B;
      --blue-glow: #4FC3F7;
      --dark-bg:   #1A1E24;
      --card-bg:   #22272E;
      --card-border: #2E3A4A;
      --text:      #D0D8E0;
    }

    html, body {
      height: 100%;
      background: var(--dark-bg);
      font-family: 'Raleway', sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    #stars {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none;
    }

    .page {
      position: relative; z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .site-title {
      font-family: 'Cinzel Decorative', cursive;
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      color: var(--gold);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 4px;
      text-shadow: 0 0 20px rgba(200,151,42,.6), 0 0 60px rgba(79,195,247,.3);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 40px 42px 36px;
      width: 100%; max-width: 440px;
      text-align: center;
      box-shadow: 0 0 0 1px rgba(79,195,247,.08), 0 20px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.04);
      animation: cardIn .6s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(.97); }
      to   { opacity: 1; transform: translateY(0)    scale(1);   }
    }

    .card-heading {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      color: var(--gold-lt);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .logout-message {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text);
      opacity: 0.85;
      margin-bottom: 24px;
    }

    .timer-container {
      margin: 20px auto;
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      color: var(--blue-glow);
      letter-spacing: 1px;
    }

    .progress-bar {
      width: 100%;
      height: 3px;
      background: rgba(79, 195, 247, 0.1);
      border-radius: 2px;
      margin-top: 10px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 100%;
      background: var(--blue-glow);
      box-shadow: 0 0 8px var(--blue-glow);
      animation: dynamicCountdown 5s linear forwards;
    }

    @keyframes dynamicCountdown {
      from { width: 100%; }
      to   { width: 0%; }
    }

    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, var(--card-border), transparent);
      margin: 24px 0;
    }

    .btn-return {
      width: 100%;
      padding: 14px;
      background: #2E3A4A;
      border: 1px solid transparent;
      border-radius: 8px;
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text);
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,.2);
      transition: transform .15s, box-shadow .15s, border-color .15s, color .15s;
    }
    .btn-return:hover {
      transform: translateY(-2px);
      border-color: var(--blue-glow);
      color: #fff;
      box-shadow: 0 6px 20px rgba(79,195,247,.15);
    }
  </style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="page">
  <div class="site-title">Spellcasting</div>

  <div class="card">
    <div class="card-heading">🔮 Connection Severed</div>
    
    <p class="logout-message">
      You have broken your link with the Talking Tome and safely exited the layout chambers. Your spell progression has been secured.
    </p>

    <div class="timer-container">
      Returning to login screen in <span id="countdown">5</span> seconds...
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
    </div>

    <div class="divider"></div>

    <button class="btn-return" onclick="redirectToLogin()">Return Immediately</button>
  </div>
</div>

<script>
(function() {
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  let W, H, stars = [];
  function resize() {
    W = c.width  = window.innerWidth;
    H = c.height = window.innerHeight;
    stars = Array.from({length: 120}, () => ({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*1.2+.2,
      a: Math.random(), da: (Math.random()-.5)*.006
    }));
  }
  function draw() {
    ctx.clearRect(0,0,W,H);
    stars.forEach(s => {
      s.a = Math.max(.05, Math.min(1, s.a + s.da));
      if (s.a <= .05 || s.a >= 1) s.da *= -1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(160,190,240,${s.a})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  resize(); draw();
})();

let timeLeft = 5;
const countdownEl = document.getElementById('countdown');

const interval = setInterval(() => {
  timeLeft--;
  countdownEl.textContent = timeLeft;
  if (timeLeft <= 0) {
    clearInterval(interval);
    redirectToLogin();
  }
}, 1000);

function redirectToLogin() {
  window.location.href = "/login/";
}
</script>
</body>
</html>
