{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spellcasting – Login</title>
  
  <link rel="manifest" href="{% url 'manifest.json' %}">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-title" content="Spellcasting">

  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600&family=Raleway:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:      #C8972A;
      --gold-lt:   #E8B84B;
      --blue-glow: #4FC3F7;
      --blue-dim:  #1A3A5C;
      --dark-bg:   #1A1E24;
      --card-bg:   #22272E;
      --card-border: #2E3A4A;
      --text:      #D0D8E0;
      --muted:     #7A8A9A;
      --error:     #E57373;
    }

    html, body {
      min-height: 100vh;
      background: #0b0c10 url('/static/bee/images/entrance.webp') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Raleway', sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    .page {
      position: relative; z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .site-title {
      font-family: 'Cinzel Decorative', cursive;
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      color: var(--gold);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 4px;
      text-shadow: 0 0 20px rgba(200,151,42,.6), 0 0 60px rgba(79,195,247,.3);
      animation: titlePulse 3s ease-in-out infinite;
    }
    @keyframes titlePulse {
      0%,100% { text-shadow: 0 0 20px rgba(200,151,42,.6), 0 0 60px rgba(79,195,247,.25); }
      50%      { text-shadow: 0 0 35px rgba(200,151,42,.9), 0 0 90px rgba(79,195,247,.5);  }
    }
    .site-sub {
      font-family: 'Cinzel', serif;
      font-size: .78rem;
      color: var(--muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 36px;
    }

    .card {
      background: rgba(34, 39, 46, 0.85);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 40px 42px 36px;
      width: 100%; max-width: 420px;
      box-shadow: 0 0 0 1px rgba(79,195,247,.08), 0 20px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.04);
      animation: cardIn .6s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(.97); }
      to   { opacity: 1; transform: translateY(0)    scale(1);   }
    }

    .card-heading {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      color: var(--gold-lt);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 28px;
    }

    .error-box {
      background: rgba(229,115,115,.1);
      border: 1px solid rgba(229,115,115,.4);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 20px;
      font-size: .82rem;
      color: var(--error);
      font-weight: 700;
      text-align: center;
      letter-spacing: .5px;
    }

    .field { margin-bottom: 18px; }
    label {
      display: block;
      font-size: .72rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      background: #1A1E24;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      font-family: 'Raleway', sans-serif;
      font-size: .95rem;
      font-weight: 600;
      color: #E8EDF2;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus {
      border-color: rgba(79,195,247,.5);
      box-shadow: 0 0 0 3px rgba(79,195,247,.1);
    }
    input::placeholder { color: #3A4A5A; }

    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 44px; }
    .pw-toggle {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 1rem; padding: 0;
      transition: color .2s;
    }
    .pw-toggle:hover { color: var(--blue-glow); }

    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, var(--card-border), transparent);
      margin: 24px 0;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #B8851E 0%, #D4A030 50%, #B8851E 100%);
      border: none;
      border-radius: 8px;
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #1A1206;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(200,151,42,.35);
      transition: transform .15s, box-shadow .15s, filter .15s;
      position: relative;
      overflow: hidden;
    }
    .btn-login::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.12) 0%, transparent 60%);
      border-radius: 8px;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(200,151,42,.5), 0 0 40px rgba(79,195,247,.15);
      filter: brightness(1.08);
    }
    .btn-login:active {
      transform: translateY(1px);
      box-shadow: 0 2px 10px rgba(200,151,42,.3);
    }

    .card-footer {
      text-align: center;
      margin-top: 20px;
      font-size: .78rem;
      color: var(--muted);
      letter-spacing: .5px;
    }
    .card-footer a { color: var(--gold-lt); text-decoration: none; }
    .card-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="page">
  <div class="site-title">Spellcasting</div>
  <div class="site-sub">A Voice-Controlled Spelling Adventure</div>

  <div class="card">
    <div class="card-heading">⚡ Enter the Arena</div>

    {% if form.errors %}
    <div class="error-box">✦ Invalid username or password ✦</div>
    {% endif %}
    {% if next %}
    <div class="error-box">🔒 Please log in to continue</div>
    {% endif %}

    <form method="POST" action="{% url 'login' %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}"/>

      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username"
               placeholder="Enter your username"
               value="{{ form.username.value|default:'' }}"
               autocomplete="username" required autofocus/>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" name="password"
                 placeholder="Enter your password"
                 autocomplete="current-password" required/>
          <button type="button" class="pw-toggle" onclick="togglePw()">👁</button>
        </div>
      </div>

      <div class="divider"></div>

      <button type="submit" class="btn-login">Begin Spellcasting</button>
    </form>
  </div>

  <div class="card-footer" style="margin-top:16px;">
  No account yet? <a href="/register/">Register here</a>
</div>
</div>

<script>
function togglePw() {
  const inp = document.getElementById('password');
  const btn = document.querySelector('.pw-toggle');
  if (inp.type === 'password') { inp.type = 'text';      btn.textContent = '🙈'; }
  else                         { inp.type = 'password'; btn.textContent = '👁';  }
}

// PWA Service Worker Root Registration Execution Link
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register("{% url 'sw.js' %}");
    });
}
</script>
</body>
</html>
