{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpellCasting Arena - Active Combat</title>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600&family=Raleway:wght@400;600;700&display=swap" rel="stylesheet"/>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --dark-bg:   #1A1E24;
            --card-bg:   #22272E;
            --card-border: #2E3A4A;
            --gold:      #C8972A;
            --gold-lt:   #E8B84B;
            --blue-glow: #4FC3F7;
            --text:      #D0D8E0;
            --muted:     #7A8A9A;
            
            --success:   #81C784;
            --warning:   #FFB74D;
            --danger:    #EF5350;
        }

        body {
            min-height: 100vh;
            background-color: var(--dark-bg);
            color: var(--text);
            font-family: 'Raleway', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        #stars { 
            position: fixed; 
            inset: 0; 
            z-index: 0; 
            pointer-events: none; 
        }

        .container {
            position: relative;
            z-index: 10;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 45px 40px;
            border-radius: 24px;
            text-align: center;
            width: 90%;
            max-width: 650px;
            box-shadow: 0 0 0 1px rgba(79,195,247,.08), 
                        0 20px 60px rgba(0,0,0,.6), 
                        inset 0 1px 0 rgba(255,255,255,.04);
            transition: transform 0.3s ease;
        }

        /* Unified Header Style */
        .site-title {
            font-family: 'Cinzel Decorative', cursive;
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            color: var(--gold); letter-spacing: 4px;
            text-transform: uppercase; 
            margin-bottom: 25px; 
            animation: titlePulse 3s ease-in-out infinite;
        }
        @keyframes titlePulse {
            0%,100% { text-shadow: 0 0 20px rgba(200,151,42,.6), 0 0 60px rgba(79,195,247,.25); }
            50%     { text-shadow: 0 0 35px rgba(200,151,42,.9), 0 0 90px rgba(79,195,247,.5); }
        }
        
        .spelling-display.message-mode {
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            letter-spacing: 2px;
        }
        
        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 0 25px 0;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-badge {
            background: rgba(0, 0, 0, 0.25);
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .score-box { 
            color: var(--blue-glow); 
            font-family: 'Cinzel', serif;
            text-shadow: 0 0 15px rgba(79,195,247,.4);
        }
        .timer-box { color: var(--warning); width: 95px; }
        .hearts-box { letter-spacing: 2px; }

        .battle-arena {
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .enemy-sprite {
            font-size: 5rem; 
            min-height: 100px;
            margin-bottom: 10px;
            transition: transform 0.2s ease, opacity 0.5s ease;
        }
        .health-bar-container {
            width: 250px;
            height: 16px;
            background-color: #1A1E24;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            margin-bottom: 15px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .health-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #b71c1c 0%, #e53935 100%); 
            transition: width 0.3s ease-in-out;
        }
        .enemy-name {
            color: var(--danger);
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(239, 83, 80, 0.4);
        }

        @keyframes monsterDamage {
            0% { transform: scale(1) translateX(0); filter: brightness(1) drop-shadow(0 0 0 rgba(255,0,0,0)); }
            15% { transform: scale(1.2) translateX(-10px); filter: brightness(5) drop-shadow(0 0 15px #ff3333); }
            30% { transform: scale(1) translateX(10px); filter: brightness(5) drop-shadow(0 0 15px #fff); }
            45% { transform: scale(1.1) translateX(-8px); filter: brightness(3); }
            60% { transform: scale(1) translateX(8px); filter: brightness(2); }
            80% { transform: scale(1.05) translateX(-4px); filter: brightness(1.5); }
            100% { transform: scale(1) translateX(0); filter: brightness(1) drop-shadow(0 0 0 rgba(0,0,0,0)); }
        }

        @keyframes monsterAttack {
            0% { transform: translateY(0) scale(1); filter: sepia(0); }
            20% { transform: translateY(15px) scale(0.9); filter: sepia(1) hue-rotate(-50deg) saturate(5); }
            40% { transform: translateY(-35px) scale(1.2); }
            60% { transform: translateY(0) scale(1); }
            80% { transform: translateY(-5px); }
            100% { transform: translateY(0); }
        }

        .monster-hit { animation: monsterDamage 0.5s ease-in-out forwards; }
        .monster-strike { animation: monsterAttack 0.4s ease-in-out forwards; }

        /* --- 1. Dynamic Theme Overrides --- */
        .container.theme-evoker {
            --blue-glow: #EF5350; /* Intense Destruction Crimson */
            border-color: rgba(239, 83, 80, 0.4);
        }
        .container.theme-warlock {
            --blue-glow: #A855F7; /* Affliction Shadow Purple */
            border-color: rgba(168, 85, 247, 0.4);
        }
        .container.theme-paladin {
            --blue-glow: #FFB74D; /* Righteous Radiant Gold */
            border-color: rgba(255, 183, 77, 0.4);
        }
        
        /* --- 2. Visual Listening Feedback (Mana Aura) --- */
        @keyframes auraPulse {
            0%, 100% { box-shadow: 0 0 1px rgba(79,195,247,.08), 0 20px 60px rgba(0,0,0,.6), 0 0 15px var(--blue-glow); }
            50% { box-shadow: 0 0 1px rgba(79,195,247,.08), 0 20px 60px rgba(0,0,0,.6), 0 0 35px var(--blue-glow); }
        }
        .container.listening {
            animation: auraPulse 1.8s infinite ease-in-out;
            border-color: var(--blue-glow) !important;
        }
        
        /* --- 3. Combo Multiplier (Mana Surge Visuals) --- */
        @keyframes surgeShake {
            0%, 100% { transform: scale(1.02); }
            50% { transform: scale(1.04); filter: brightness(1.15); }
        }
        .container.mana-surge {
            animation: surgeShake 1s infinite ease-in-out, auraPulse 0.5s infinite ease-in-out;
            border: 2px solid var(--blue-glow) !important;
        }

        .status-box {
            color: #fff;
            margin: 15px 0;
            min-height: 35px;
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 1px;
            transition: color 0.2s ease;
        }

        .spelling-display {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: bold;
            letter-spacing: 6px;
            margin: 20px 0 35px 0;
            color: var(--blue-glow);
            min-height: 75px;
            text-transform: uppercase;
            word-wrap: break-word;
            text-shadow: 0 0 15px rgba(79,195,247,.3);
        }

        /* Unified Button Layout */
        .action-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            transition: transform .15s, box-shadow .15s, filter .15s;
            gap: 8px;
            width: 100%;
        }

        .btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); }
        .btn:active:not(:disabled) { transform: scale(0.98); }

        .btn-magic {
            background: linear-gradient(135deg, #4b367c 0%, #512DA8 100%);
            color: #FFF; box-shadow: 0 4px 15px rgba(81, 45, 168, 0.3);
        }
        
        .btn-dark {
            background: #2E3A4A; color: var(--text); 
            box-shadow: 0 4px 15px rgba(0,0,0,.3); 
            border: 1px solid rgba(255,255,255,0.05);
        }

        .btn-danger {
            background: linear-gradient(135deg, #7f2b2b 0%, #b73838 100%);
            color: #FFF; box-shadow: 0 4px 15px rgba(183, 56, 56, 0.2);
        }

        .btn:disabled {
            background: #2E3A4A !important;
            color: var(--muted) !important;
            box-shadow: none !important;
            border: none !important;
            cursor: not-allowed;
            transform: none !important;
            filter: grayscale(1) opacity(0.5) !important;
        }
    </style>
</head>
<body>

{% csrf_token %}

<canvas id="stars"></canvas>

<div class="container">
    <div id="gameScreen">
        
        <div class="site-title">Spellcasting</div>

        <div class="stats-row">
            <div class="stat-badge score-box">
                SCORE: <span id="score">0</span> 
                <span id="multDisplay" style="color: var(--warning); font-size: 0.85rem; margin-left: 6px; display: none; font-family: 'Cinzel', serif; font-weight: bold;"></span>
            </div>
            <div class="stat-badge timer-box">⏱️ <span id="timerDisplay">15</span>s</div>
            <div class="stat-badge hearts-box" id="heartsDisplay">❤️ ❤️ ❤️</div>
        </div>

        <div class="battle-arena">
            <div id="enemyName" class="enemy-name">MINION</div>
            <div class="health-bar-container">
                <div id="enemyHealth" class="health-bar"></div>
            </div>
            <div id="enemySprite" class="enemy-sprite">👻</div>
        </div>

        <div id="status" class="status-box">Loading arena...</div>
        <div id="spellingDisplay" class="spelling-display">---</div>

        <div class="action-layout">
            <button class="btn btn-magic" id="repeatBtn" onclick="repeatWord()">
                📖 Recall
            </button>
            <button class="btn btn-dark" id="clearBtn" onclick="clearSpelling()">
                ✨ Dispel
            </button>
        </div>

        <button class="btn btn-danger" id="exitBtn" style="margin-top: 15px;" onclick="exitToMenu()">
            🚪 RETREAT TO BASE
        </button>
    </div>
</div>

<script>
    /* ==========================================================================
       DYNAMIC BACKGROUND STARDUST
       ========================================================================== */
    (function() {
        const c = document.getElementById('stars');
        const ctx = c.getContext('2d');
        let W, H, stars = [];
        function resize() {
            W = c.width = window.innerWidth; H = c.height = window.innerHeight;
            stars = Array.from({length: 180}, () => ({
                x: Math.random()*W, y: Math.random()*H,
                r: Math.random()*1.4+.2, a: Math.random(), da: (Math.random()-.5)*.008
            }));
        }
        function draw() {
            ctx.clearRect(0,0,W,H);
            stars.forEach(s => {
                s.a = Math.max(.05, Math.min(1, s.a + s.da));
                if (s.a <= .05 || s.a >= 1) s.da *= -1;
                ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
                ctx.fillStyle = `rgba(200,220,255,${s.a})`; ctx.fill();
            });
            requestAnimationFrame(draw);
        }
        window.addEventListener('resize', resize); resize(); draw();
    })();

    /* ==========================================================================
       GAME STATE & DICTIONARIES
       ========================================================================== */
    const difficultyWords = {
        // 3 to 5 Letters
        easy: [
            // --- EVOKER (Destruction) ---
            "fire", "zap", "bolt", "burn", "arc", "ray", "shock", "flare", "spark", "beam", 
            "blaze", "volt", "acid", "surge", "flash", "melt", "burst", "erupt", "blast", "boom",
            // --- WARLOCK (Affliction / Shadow) ---
            "hex", "rot", "curse", "drain", "taint", "bane", "agony", "choke", "toxin", "sting", 
            "lash", "haunt", "gouge", "venom", "spite", "leech", "bile", "vile", "reap", "rip",
            // --- CLERIC / PALADIN (Exorcism / Holy Wrath) ---
            "smite", "purge", "scour", "wrath", "light", "brand", "doom", "holy", "zeal", "force", 
            "crush", "smash", "blind", "flay", "glare", "judge", "fury", "pure", "clean", "quell"
        ],
        // 6 to 8 Letters
        medium: [
            // --- EVOKER (Destruction) ---
            "ignite", "thunder", "scorch", "tempest", "vortex", "meteor", "barrage", "bombard", "explode", "rupture", 
            "implode", "blizzard", "eruption", "vaporize", "dissolve", "liquefy", "combust", "detonate", "inferno", "shatter",
            // --- WARLOCK (Affliction / Shadow) ---
            "blight", "plague", "wither", "fester", "poison", "stifle", "corrupt", "torment", "afflict", "vitiate", 
            "inflict", "despoil", "profane", "smother", "anguish", "mortify", "subvert", "strangle", "necrosis", "cripple",
            // --- CLERIC / PALADIN (Exorcism / Holy Wrath) ---
            "cleanse", "purging", "hallow", "condemn", "crusade", "justice", "chastise", "rebuke", "sunbeam", "moonbeam", 
            "exorcise", "scourge", "execrate", "censure", "punish", "judgment", "radiant", "divine", "avenging", "penalize"
        ],
        // 9+ Letters
        hard: [
            // --- EVOKER (Destruction) ---
            "conflagration", "obliteration", "devastation", "annihilation", "electrocution", "disintegration", "cataclysm", "apocalypse", "armageddon", "maelstrom", 
            "singularity", "incineration", "immolation", "thunderbolt", "firestorm", "supernova", "bombardment", "liquefaction", "pulverization", "combustion",
            // --- WARLOCK (Affliction / Shadow) ---
            "malediction", "imprecation", "putrefaction", "decomposition", "exsanguination", "enervation", "defilement", "infestation", "debilitation", "enslavement", 
            "pestilence", "corruption", "vilification", "desecration", "suffocation", "strangulation", "mutilation", "depravation", "devitalization", "extinction",
            // --- CLERIC / PALADIN (Exorcism / Holy Wrath) ---
            "purification", "consecration", "sanctification", "righteousness", "illumination", "condemnation", "extermination", "retribution", "castigation", "vindication", 
            "inquisition", "damnation", "excommunication", "decimation", "subjugation", "persecution", "execution", "chastisement", "admonition", "proscription"
        ]
    };

    // Flat taxonomy arrays used to quickly check what theme style to paint on the DOM
    const archetypes = {
        evoker: [
            "fire", "zap", "bolt", "burn", "arc", "ray", "shock", "flare", "spark", "beam", 
            "blaze", "volt", "acid", "surge", "flash", "melt", "burst", "erupt", "blast", "boom",
            "ignite", "thunder", "scorch", "tempest", "vortex", "meteor", "barrage", "bombard", "explode", "rupture", 
            "implode", "blizzard", "eruption", "vaporize", "dissolve", "liquefy", "combust", "detonate", "inferno", "shatter",
            "conflagration", "obliteration", "devastation", "annihilation", "electrocution", "disintegration", "cataclysm", "apocalypse", "armageddon", "maelstrom", 
            "singularity", "incineration", "immolation", "thunderbolt", "firestorm", "supernova", "bombardment", "liquefaction", "pulverization", "combustion"
        ],
        warlock: [
            "hex", "rot", "curse", "drain", "taint", "bane", "agony", "choke", "toxin", "sting", 
            "lash", "haunt", "gouge", "venom", "spite", "leech", "bile", "vile", "reap", "rip",
            "blight", "plague", "wither", "fester", "poison", "stifle", "corrupt", "torment", "afflict", "vitiate", 
            "inflict", "despoil", "profane", "smother", "anguish", "mortify", "subvert", "strangle", "necrosis", "cripple",
            "malediction", "imprecation", "putrefaction", "decomposition", "exsanguination", "enervation", "defilement", "infestation", "debilitation", "enslavement", 
            "pestilence", "corruption", "vilification", "desecration", "suffocation", "strangulation", "mutilation", "depravation", "devitalization", "extinction"
        ],
        paladin: [
            "smite", "purge", "scour", "wrath", "light", "brand", "doom", "holy", "zeal", "force", 
            "crush", "smash", "blind", "flay", "glare", "judge", "fury", "pure", "clean", "quell",
            "cleanse", "purging", "hallow", "condemn", "crusade", "justice", "chastise", "rebuke", "sunbeam", "moonbeam", 
            "exorcise", "scourge", "execrate", "censure", "punish", "judgment", "radiant", "divine", "avenging", "penalize",
            "purification", "consecration", "sanctification", "righteousness", "illumination", "condemnation", "extermination", "retribution", "castigation", "vindication", 
            "inquisition", "damnation", "excommunication", "decimation", "subjugation", "persecution", "execution", "chastisement", "admonition", "proscription"
        ]
    };
        
    const monsterNames = ["Infernal Devil", "Wraith", "Abyssal Demon", "Skeleton", "Vampire", "Zombie"];
    const monsterSprites = ["👿", "👻", "👹", "💀", "🧛", "🧟"];

    const urlParams = new URLSearchParams(window.location.search);
    let selectedDifficultySetting = urlParams.get('difficulty') || "easy";
    
    let wordsPool = [];
    let currentWord = "";
    
    let score = 0;
    let lives = 3;
    let comboCount = 0;
    let multiplier = 1;
    let gameOver = false;
    let isTransitioning = false; 

    let timeLeft = 15;
    let countdownInterval = null;

    const synth = window.speechSynthesis;
    const SpeechRecognition = window.webkitSpeechRecognition || window.SpeechRecognition;
    const SpeechGrammarList = window.webkitSpeechGrammarList || window.SpeechGrammarList;
    let recognition = null;

    const validLetters = {
        "a":"a", "ay":"a", "hey":"a",
        "b":"b", "be":"b", "bee":"b",
        "c":"c", "see":"c", "sea":"c",
        "d":"d", "dee":"d",
        "e":"e",
        "f":"f", "ef":"f",
        "g":"g", "jee":"g",
        "h":"h", "aitch":"h",
        "i":"i", "eye":"i",
        "j":"j", "jay":"j",
        "k":"k", "kay":"k",
        "l":"l", "el":"l",
        "m":"m", "em":"m",
        "n":"n", "en":"n",
        "o":"o", "oh":"o",
        "p":"p", "pee":"p",
        "q":"q", "queue":"q",
        "r":"r", "are":"r", "our":"r",
        "s":"s", "ess":"s",
        "t":"t", "tea":"t", "tee":"t",
        "u":"u", "you":"u",
        "v":"v", "vee":"v",
        "w":"w", "doubleyou":"w",
        "x":"x", "ex":"x",
        "y":"y", "why":"y",
        "z":"z", "zee":"z", "zed":"z"
    };

    const wordToLetterMap = {
        "for": "f", "four": "f", "to": "t", "too": "t", "two": "t", "see": "c", "sea": "c",
        "bee": "b", "be": "b", "are": "r", "our": "r", "you": "u", "why": "y", "oh": "o", "know": "n", "no": "n"
    };

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true; 
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        if (SpeechGrammarList) {
            const grammarWords = Object.keys(validLetters);
            const jsgfGrammar = `#JSGF V1.0; grammar letters; public <letter> = ${grammarWords.join(' | ')} ;`;
            const speechRecognitionList = new SpeechGrammarList();
            speechRecognitionList.addFromString(jsgfGrammar, 1);
            recognition.grammars = speechRecognitionList;
        }
    } else {
        alert("Your browser does not support Web Speech API. Please use Google Chrome.");
    }

    function exitToMenu() {
        gameOver = true;     
        stopTimer();                
        safelyStopRecognition();    
        if (synth && synth.speaking) {
            synth.cancel();         
        }
        window.location.href = "/"; 
    }

    function speak(text, callback) {
        if (synth.speaking) synth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.85;
        if(callback) utterance.onend = callback;
        synth.speak(utterance);
    }

    function renderHearts() {
        let hearts = "";
        for (let i = 0; i < 3; i++) {
            hearts += i < lives ? "❤️ " : "🖤 ";
        }
        document.getElementById('heartsDisplay').innerText = hearts;
    }

    function startGame() {
        wordsPool = [...difficultyWords[selectedDifficultySetting]];
        score = 0;
        lives = 3;
        gameOver = false;
        isTransitioning = false;

        comboCount = 0;
        multiplier = 1;
        updateMultiplierUI();
        document.querySelector('.container').classList.remove('theme-evoker', 'theme-warlock', 'theme-paladin', 'mana-surge');

        document.getElementById('score').innerText = score;
        renderHearts();
        document.getElementById('spellingDisplay').classList.remove('message-mode');

        setInterfaceDisabled(false);
        nextWord();
    }

    function nextWord() {
        if (gameOver) return;
        isTransitioning = false;
        setInterfaceDisabled(false);

        if (wordsPool.length === 0) {
            gameOver = true;
            stopTimer();
            safelyStopRecognition();
            document.getElementById('status').innerText = "🏆 THE HORDE IS VANQUISHED!";
            document.getElementById('status').style.color = "var(--success)";
            const spellingEl = document.getElementById('spellingDisplay');
            spellingEl.classList.add('message-mode');
            spellingEl.innerText = "DUNGEON CLEARED";
            setInterfaceDisabled(true);
            return;
        }

        document.getElementById('enemyHealth').style.width = "100%";
        const randomMonsterIdx = Math.floor(Math.random() * monsterSprites.length);
        document.getElementById('enemyName').innerText = monsterNames[randomMonsterIdx].toUpperCase();
        document.getElementById('enemySprite').innerText = monsterSprites[randomMonsterIdx];

        const randomIndex = Math.floor(Math.random() * wordsPool.length);
        currentWord = wordsPool[randomIndex];
        
        // DYNAMIC UI THEME SHIFT: Check the current active dictionary archetype
        const container = document.querySelector('.container');
        container.classList.remove('theme-evoker', 'theme-warlock', 'theme-paladin');
        
        if (archetypes.evoker.includes(currentWord)) {
            container.classList.add('theme-evoker');
        } else if (archetypes.warlock.includes(currentWord)) {
            container.classList.add('theme-warlock');
        } else if (archetypes.paladin.includes(currentWord)) {
            container.classList.add('theme-paladin');
        }

        document.getElementById('spellingDisplay').innerText = "---";
        document.getElementById('status').innerText = "Listening to the Talking Tome...";
        document.getElementById('status').style.color = "white";

        speak("The incantation is " + currentWord, () => {
            if(!gameOver && !isTransitioning) {
                document.getElementById('status').innerText = "Spell your spell! 🎙️";
                startTimer();
                startListening();
            }
        });
    }

    function repeatWord() {
        if(isTransitioning || gameOver) return;
        safelyStopRecognition(); 
        
        speak("The incantation is " + currentWord, () => {
            if(!gameOver && !isTransitioning) {
                startListening(); 
            }
        });
    }

    function clearSpelling() {
        if (gameOver || isTransitioning) return;
    
        document.getElementById('spellingDisplay').innerText = "---";
        safelyStopRecognition();
    }

    // Helper UI update utility
    function updateMultiplierUI() {
        const el = document.getElementById('multDisplay');
        const container = document.querySelector('.container');
        
        if (multiplier > 1) {
            el.innerText = multiplier === 3 ? `x${multiplier} SURGE!` : `x${multiplier}`;
            el.style.display = 'inline';
            el.style.color = multiplier === 3 ? 'var(--danger)' : 'var(--warning)';
        } else {
            el.style.display = 'none';
            container.classList.remove('mana-surge');
        }
    }

    function setInterfaceDisabled(disabled) {
        document.getElementById('repeatBtn').disabled = disabled;
        document.getElementById('clearBtn').disabled = disabled;
    }

    function startTimer() {
        stopTimer();
        timeLeft = 15;
        document.getElementById('timerDisplay').innerText = timeLeft;

        countdownInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timerDisplay').innerText = timeLeft;

            if (timeLeft <= 0) {
                stopTimer();
                safelyStopRecognition();
                handleIncorrectTransition("The spell fizzled!");
            }
        }, 1000);
    }

    function stopTimer() {
        if (countdownInterval) clearInterval(countdownInterval);
    }

    function triggerGameOver() {
        gameOver = true;
        stopTimer();
        safelyStopRecognition();
        setInterfaceDisabled(true);
        document.getElementById('status').innerText = "💀 YOU HAVE FALLEN";
        document.getElementById('status').style.color = "var(--danger)";
        const spellingEl = document.getElementById('spellingDisplay');
        spellingEl.classList.add('message-mode');
        spellingEl.innerText = "VITALITY DEPLETED";
    }

    function startListening() {
        if (gameOver || isTransitioning || !recognition) return;
        try { 
            recognition.start(); 
            document.querySelector('.container').classList.add('listening');
        } catch(e) {}
    }

    function safelyStopRecognition() {
        if (recognition) {
            try { recognition.stop(); } catch(e) {}
        }
        document.querySelector('.container').classList.remove('listening');
    }

    function handleIncorrectTransition(reasonText) {
        isTransitioning = true;
        setInterfaceDisabled(true);
        lives--;
        renderHearts();
        comboCount = 0;
        multiplier = 1;
        updateMultiplierUI();

        const sprite = document.getElementById('enemySprite');
        if (sprite) {
            sprite.classList.add('monster-strike');
            setTimeout(() => { sprite.classList.remove('monster-strike'); }, 400);
        }

        if (lives <= 0) {
            triggerGameOver();
        } else {
            document.getElementById('status').innerText = `${reasonText} The true incantation was: ${currentWord.toUpperCase()}`;
            document.getElementById('status').style.color = "var(--danger)";
            speak(`Cat got your tongue? The incantation was ${currentWord}`, () => {
                setTimeout(nextWord, 1500);
            });
        }
    }

    if (recognition) {
        recognition.onresult = function(event) {
            if (isTransitioning || gameOver) return;

            let liveTotalSpelling = "";

            for (let i = 0; i < event.results.length; i++) {
                let chunk = event.results[i][0].transcript.toLowerCase().trim();
                let spokenParts = chunk.replace(/[^a-zA-Z -]/g, "").split(/[\s-]+/);

                spokenParts.forEach(part => {
                    if (!part) return;
                    
                    if (validLetters[part]) {
                        liveTotalSpelling += validLetters[part];
                    } else if (wordToLetterMap[part]) {
                        liveTotalSpelling += wordToLetterMap[part];
                    } else {
                        // STRICT LETTER VERIFICATION RULE
                        // Discards spoken multi-character full cheat words instantly
                        if (part.length === 1 && part >= 'a' && part <= 'z') {
                            liveTotalSpelling += part;
                        }
                    }
                });
            }
            
            liveTotalSpelling = liveTotalSpelling.trim();

            if (liveTotalSpelling.length > 0) {
                document.getElementById('spellingDisplay').innerText = liveTotalSpelling.split("").join(" ");
            }

            // SUCCESS STATE CHECK
            if (liveTotalSpelling === currentWord) {
                isTransitioning = true; 
                stopTimer();
                safelyStopRecognition();
                setInterfaceDisabled(true);

                comboCount++;
                if (comboCount >= 6) {
                    multiplier = 3;
                    document.querySelector('.container').classList.add('mana-surge');
                } else if (comboCount >= 3) {
                    multiplier = 2;
                } else {
                    multiplier = 1;
                }
                updateMultiplierUI();
            
                score += multiplier;
                document.getElementById('score').innerText = score;
                
                document.getElementById('status').innerText = "✨ THE MONSTER IS DEFEATED!";
                document.getElementById('status').style.color = "var(--success)";

                const sprite = document.getElementById('enemySprite');
                if (sprite) {
                    sprite.classList.add('monster-hit');
                    setTimeout(() => { sprite.classList.remove('monster-hit'); }, 500);
                }
                document.getElementById('enemyHealth').style.width = "0%";

                submitScoreToDjango(score);
                wordsPool = wordsPool.filter(w => w !== currentWord);
                
                speak("A fatal blow!", () => {
                    setTimeout(nextWord, 1200);
                });
                return; 
            }
            
            // EXCEEDED LENGTH FAILURE GATECHECK
            if (liveTotalSpelling.length >= currentWord.length && liveTotalSpelling !== currentWord) {
                isTransitioning = true;
                stopTimer();
                safelyStopRecognition();
                handleIncorrectTransition("The runes shattered!");
            }
        };
    
        recognition.onend = function () {
            if (!gameOver && !isTransitioning) {
                try { recognition.start(); } catch(e) {}
            }
        };
        
        recognition.onerror = function(e) {
            console.error("Speech error processing: ", e.error);
            
            // Check for terminal security or hardware blocks
            if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
                gameOver = true;
                stopTimer();
                setInterfaceDisabled(true);
                document.getElementById('status').innerText = "🎙️ Connection Lost: Microphone Access Denied.";
                document.getElementById('status').style.color = "var(--danger)";
            }
            
            safelyStopRecognition();
        };
    }

    function submitScoreToDjango(currentScore) {
        const currentDifficulty = typeof selectedDifficultySetting !== 'undefined' ? selectedDifficultySetting : 'easy';
        const csrfEl = document.querySelector('[name=csrfmiddlewaretoken]');
        if (!csrfEl) {
            console.error("Security Halt: CSRF element token verification missing from current DOM context.");
            return;
        }
        const csrftoken = csrfEl.value;

        fetch('/api/save-score/', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'X-CSRFToken': csrftoken 
            },
            body: JSON.stringify({
                score: currentScore,            
                difficulty: currentDifficulty   
            })
        })
        .then(response => {
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            return response.json();
        })
        .then(data => {
            if (data.status === 'success') {
                console.log("✨ Score locked into PostgreSQL successfully!");
            } else {
                console.error("Database save failed:", data.message);
            }
        })
        .catch(error => {
            console.error("Error reporting score to server:", error);
        });
    }

    window.onload = function() {
        startGame();
    };
</script>
</body>
