{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpellCasting Arena - Active Combat</title>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600&family=Raleway:wght@400;600;700&display=swap" rel="stylesheet"/>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --dark-bg:   #1A1E24;
            --card-bg:   #22272E;
            --card-border: #2E3A4A;
            --gold:      #C8972A;
            --gold-lt:   #E8B84B;
            --blue-glow: #4FC3F7;
            --text:      #D0D8E0;
            --muted:     #7A8A9A;
            
            --success:   #81C784;
            --warning:   #FFB74D;
            --danger:    #EF5350;
        }

        body {
            min-height: 100vh;
            background-color: #0b0c10;
            background-image: url('/static/bee/images/darkdungeon.jpg');
            background-size: cover;
            background-position: center;
            color: var(--text);
            font-family: 'Raleway', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .vignette-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.95);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 10;
            background: transparent; 
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            width: 100vw;
            min-height: 100vh;
            max-width: none;
            border-radius: 0;
            border: none;
            box-shadow: none;
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s ease;
        }
        
        #gameScreen {
            width: 100%;
            max-width: 650px;
            margin: auto; 
            display: flex;
            flex-direction: column;
        }
        /* Unified Header Style */
        .site-title {
            font-family: 'Cinzel Decorative', cursive;
            font-size: clamp(1.6rem, 3.5vw, 2.2rem); /* Responsive scale down */
            color: var(--gold); letter-spacing: 4px;
            text-transform: uppercase; 
            margin-bottom: 10px; /* Reduced from 15px */
            animation: titlePulse 3s ease-in-out infinite;
        }
        @keyframes titlePulse {
            0%,100% { text-shadow: 0 0 20px rgba(200,151,42,.6), 0 0 60px rgba(79,195,247,.25); }
            50%     { text-shadow: 0 0 35px rgba(200,151,42,.9), 0 0 90px rgba(79,195,247,.5); }
        }
        
        .spelling-display.message-mode {
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            letter-spacing: 2px;
        }
        
        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 0 15px 0;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-badge {
            background: rgba(0, 0, 0, 0.25);
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .score-box { 
            color: var(--blue-glow); 
            font-family: 'Cinzel', serif;
            text-shadow: 0 0 15px rgba(79,195,247,.4);
        }
        .timer-box { color: var(--warning); width: 95px; }
        .hearts-box { letter-spacing: 2px; }

        .battle-arena {
            margin: 10px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .enemy-sprite {
            height: 250px; 
            width: auto;
            margin-bottom: 5px;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            transition: transform 0.2s ease, filter 0.5s ease, opacity 0.6s ease;
        }
        .health-bar-container {
            width: 250px;
            height: 24px;
            background-color: #111;
            border: 3px solid #2a2a2a;
            border-radius: 0px; 
            overflow: hidden;
            margin-bottom: 15px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.6);
        }
        
        .health-bar {
            width: 100%;
            height: 100%;
            background: #e53935; 
            box-shadow: inset 0 4px 0 rgba(255,255,255,0.2), inset 0 -4px 0 rgba(0,0,0,0.3);
            transition: width 0.2s steps(10, end); 
        }
        .enemy-name {
            color: var(--danger);
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(239, 83, 80, 0.4);
            background: rgba(0, 0, 0, 0.45);
            padding: 6px 18px;
            border-radius: 8px;
            border: 1px solid rgba(239, 83, 80, 0.2);
            display: inline-block;
            margin: 0 auto 10px auto;
        }
        @keyframes monsterDamage {
            0% { transform: scale(1) translateX(0); filter: brightness(1) drop-shadow(0 0 0 rgba(255,0,0,0)); }
            15% { transform: scale(1.2) translateX(-10px); filter: brightness(5) drop-shadow(0 0 15px #ff3333); }
            30% { transform: scale(1) translateX(10px); filter: brightness(5) drop-shadow(0 0 15px #fff); }
            45% { transform: scale(1.1) translateX(-8px); filter: brightness(3); }
            60% { transform: scale(1) translateX(8px); filter: brightness(2); }
            80% { transform: scale(1.05) translateX(-4px); filter: brightness(1.5); }
            100% { transform: scale(1) translateX(0); filter: brightness(1) drop-shadow(0 0 0 rgba(0,0,0,0)); }
        }

        @keyframes monsterAttack {
            0% { transform: translateY(0) scale(1); filter: sepia(0); }
            20% { transform: translateY(15px) scale(0.9); filter: sepia(1) hue-rotate(-50deg) saturate(5); }
            40% { transform: translateY(-35px) scale(1.2); }
            60% { transform: translateY(0) scale(1); }
            80% { transform: translateY(-5px); }
            100% { transform: translateY(0); }
        }

        .monster-hit { animation: monsterDamage 0.5s ease-in-out forwards; }
        .monster-strike { animation: monsterAttack 0.4s ease-in-out forwards; }

        /* --- 1. Dynamic Theme Overrides --- */
        .container.theme-evoker {
            --blue-glow: #EF5350; /* Intense Destruction Crimson */
            border-color: rgba(239, 83, 80, 0.4);
        }
        .container.theme-warlock {
            --blue-glow: #A855F7; /* Affliction Shadow Purple */
            border-color: rgba(168, 85, 247, 0.4);
        }
        .container.theme-paladin {
            --blue-glow: #FFB74D; /* Righteous Radiant Gold */
            border-color: rgba(255, 183, 77, 0.4);
        }
        
        /* --- 2. Visual Listening Feedback (Mana Aura) --- */
        @keyframes auraPulse {
            0%, 100% { 
                box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6), 
                            inset 0 0 15px var(--blue-glow); 
            }
            50% { 
                box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.4), 
                            inset 0 0 45px var(--blue-glow); 
            }
        }
        .container.listening {
            animation: auraPulse 1.8s infinite ease-in-out;
        }
        
        /* --- 3. Combo Multiplier (Mana Surge Visuals) --- */
        @keyframes surgeShake {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.01); filter: brightness(1.15); }
        }
        .container.mana-surge {
            animation: surgeShake 0.6s infinite ease-in-out, auraPulse 0.4s infinite ease-in-out;
        }

        .status-box {
            color: #fff;
            margin: 15px auto;
            min-height: 40px;
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 1px;
            transition: color 0.2s ease;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 20px;
            border-radius: 8px;
            border: none;
            box-shadow: none; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: fit-content;
            max-width: 100%;
        }

        .spelling-display {
            font-size: clamp(1.8rem, 4.5vw, 2.8rem);
            font-weight: bold;
            letter-spacing: 6px;
            margin: 6px auto 12px auto;
            color: var(--blue-glow);
            min-height: 70px;
            text-transform: uppercase;
            word-wrap: break-word;
            text-shadow: 0 0 15px rgba(79,195,247,.3);
        
            background: rgba(0, 0, 0, 0.55);
            padding: 10px 24px;
            border-radius: 12px;
            border: 1px solid var(--blue-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        
        .action-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            transition: transform .15s, box-shadow .15s, filter .15s;
            gap: 8px;
            width: 100%;
        }

        .btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); }
        .btn:active:not(:disabled) { transform: scale(0.98); }

        .btn-magic {
            background: linear-gradient(135deg, #4b367c 0%, #512DA8 100%);
            color: #FFF; box-shadow: 0 4px 15px rgba(81, 45, 168, 0.3);
        }
        
        .btn-dark {
            background: #2E3A4A; color: var(--text); 
            box-shadow: 0 4px 15px rgba(0,0,0,.3); 
            border: 1px solid rgba(255,255,255,0.05);
        }

        .btn-danger {
            background: linear-gradient(135deg, #7f2b2b 0%, #b73838 100%);
            color: #FFF; box-shadow: 0 4px 15px rgba(183, 56, 56, 0.2);
        }

        .btn:disabled {
            background: #2E3A4A !important;
            color: var(--muted) !important;
            box-shadow: none !important;
            border: none !important;
            cursor: not-allowed;
            transform: none !important;
            filter: grayscale(1) opacity(0.5) !important;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: var(--surface-color, #222); 
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            color: white;
            border: 2px solid var(--primary-color, #444);
        }
        
        .voice-hint {
            color: #ffd700;
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
        }
        
        .modal-buttons button {
            margin: 0 10px;
            padding: 10px 20px;
            font-size: 1.1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

{% csrf_token %}

<div class="vignette-overlay"></div>

<div class="container">
    <div id="gameScreen">
        
        <div class="site-title">Spellcasting</div>

        <div class="stats-row">
            <div class="stat-badge score-box">
                SCORE: <span id="score">0</span> 
                <span id="multDisplay" style="color: var(--warning); font-size: 0.85rem; margin-left: 6px; display: none; font-family: 'Cinzel', serif; font-weight: bold;"></span>
            </div>
            <div class="stat-badge timer-box">⏱️ <span id="timerDisplay">15</span>s</div>
            <div class="stat-badge hearts-box" id="heartsDisplay">❤️ ❤️ ❤️</div>
        </div>

        <div class="battle-arena">
            <div id="enemyName" class="enemy-name">MINION</div>
            <div class="health-bar-container">
                <div id="enemyHealth" class="health-bar"></div>
            </div>
            <img id="enemySprite" class="enemy-sprite" src="/static/bee/images/infernal_1.png" alt="Enemy Sprite" />
        </div>

        <div id="status" class="status-box">Loading arena...</div>
        <div id="spellingDisplay" class="spelling-display">---</div>

        <div class="action-layout">
            <button class="btn btn-magic" id="repeatBtn" onclick="repeatWord()">
                📖 Recall
            </button>
            <button class="btn btn-dark" id="clearBtn" onclick="clearSpelling()">
                ✨ Dispel
            </button>
        </div>

        <button class="btn btn-danger" id="exitBtn" style="margin-top: 15px;" onclick="exitToMenu()">
            🚪 RETREAT TO BASE
        </button>
    </div>
</div>

<div id="retreatModal" style="display: none;" class="modal-overlay">
    <div class="modal-content">
        <h2>Retreat?</h2>
        <p>Are you sure you want to abandon this battle?</p>
        <p class="voice-hint">🗣️ Say <strong>"Yes"</strong> or <strong>"No"</strong></p>
        <div class="modal-buttons">
            <button onclick="exitToMenu()">Yes</button>
            <button onclick="cancelRetreat()">No</button>
        </div>
    </div>
</div>

<script>
    /* ==========================================================================
       GAME STATE & DICTIONARIES
       ========================================================================== */
    const difficultyWords = {
        // 3 to 5 Letters
        easy: [
            // --- EVOKER (Destruction) ---
            "fire", "zap", "bolt", "burn", "arc", "ray", "shock", "flare", "spark", "beam", 
            "blaze", "volt", "acid", "surge", "flash", "melt", "burst", "erupt", "blast", "boom",
            // --- WARLOCK (Affliction / Shadow) ---
            "hex", "rot", "curse", "drain", "taint", "bane", "agony", "choke", "toxin", "sting", 
            "lash", "haunt", "gouge", "venom", "spite", "leech", "bile", "vile", "reap", "rip",
            // --- CLERIC / PALADIN (Exorcism / Holy Wrath) ---
            "smite", "purge", "scour", "wrath", "light", "brand", "doom", "holy", "zeal", "force", 
            "crush", "smash", "blind", "flay", "glare", "judge", "fury", "pure", "clean", "quell"
        ],
        // 6 to 8 Letters
        medium: [
            // --- EVOKER (Destruction) ---
            "ignite", "thunder", "scorch", "tempest", "vortex", "meteor", "barrage", "bombard", "explode", "rupture", 
            "implode", "blizzard", "eruption", "vaporize", "dissolve", "liquefy", "combust", "detonate", "inferno", "shatter",
            // --- WARLOCK (Affliction / Shadow) ---
            "blight", "plague", "wither", "fester", "poison", "stifle", "corrupt", "torment", "afflict", "vitiate", 
            "inflict", "despoil", "profane", "smother", "anguish", "mortify", "subvert", "strangle", "necrosis", "cripple",
            // --- CLERIC / PALADIN (Exorcism / Holy Wrath) ---
            "cleanse", "purging", "hallow", "condemn", "crusade", "justice", "chastise", "rebuke", "sunbeam", "moonbeam", 
            "exorcise", "scourge", "execrate", "censure", "punish", "judgment", "radiant", "divine", "avenging", "penalize"
        ],
        // 9+ Letters
        hard: [
            // --- EVOKER (Destruction) ---
            "conflagration", "obliteration", "devastation", "annihilation", "electrocution", "disintegration", "cataclysm", "apocalypse", "armageddon", "maelstrom", 
            "singularity", "incineration", "immolation", "thunderbolt", "firestorm", "supernova", "bombardment", "liquefaction", "pulverization", "combustion",
            // --- WARLOCK (Affliction / Shadow) ---
            "malediction", "imprecation", "putrefaction", "decomposition", "exsanguination", "enervation", "defilement", "infestation", "debilitation", "enslavement", 
            "pestilence", "corruption", "vilification", "desecration", "suffocation", "strangulation", "mutilation", "depravation", "devitalization", "extinction",
            // --- CLERIC / PALADIN (Exorcism / Holy Wrath) ---
            "purification", "consecration", "sanctification", "righteousness", "illumination", "condemnation", "extermination", "retribution", "castigation", "vindication", 
            "inquisition", "damnation", "excommunication", "decimation", "subjugation", "persecution", "execution", "chastisement", "admonition", "proscription"
        ]
    };

    // Flat taxonomy arrays used to quickly check what theme style to paint on the DOM
    const archetypes = {
        evoker: [
            "fire", "zap", "bolt", "burn", "arc", "ray", "shock", "flare", "spark", "beam", 
            "blaze", "volt", "acid", "surge", "flash", "melt", "burst", "erupt", "blast", "boom",
            "ignite", "thunder", "scorch", "tempest", "vortex", "meteor", "barrage", "bombard", "explode", "rupture", 
            "implode", "blizzard", "eruption", "vaporize", "dissolve", "liquefy", "combust", "detonate", "inferno", "shatter",
            "conflagration", "obliteration", "devastation", "annihilation", "electrocution", "disintegration", "cataclysm", "apocalypse", "armageddon", "maelstrom", 
            "singularity", "incineration", "immolation", "thunderbolt", "firestorm", "supernova", "bombardment", "liquefaction", "pulverization", "combustion"
        ],
        warlock: [
            "hex", "rot", "curse", "drain", "taint", "bane", "agony", "choke", "toxin", "sting", 
            "lash", "haunt", "gouge", "venom", "spite", "leech", "bile", "vile", "reap", "rip",
            "blight", "plague", "wither", "fester", "poison", "stifle", "corrupt", "torment", "afflict", "vitiate", 
            "inflict", "despoil", "profane", "smother", "anguish", "mortify", "subvert", "strangle", "necrosis", "cripple",
            "malediction", "imprecation", "putrefaction", "decomposition", "exsanguination", "enervation", "defilement", "infestation", "debilitation", "enslavement", 
            "pestilence", "corruption", "vilification", "desecration", "suffocation", "strangulation", "mutilation", "depravation", "devitalization", "extinction"
        ],
        paladin: [
            "smite", "purge", "scour", "wrath", "light", "brand", "doom", "holy", "zeal", "force", 
            "crush", "smash", "blind", "flay", "glare", "judge", "fury", "pure", "clean", "quell",
            "cleanse", "purging", "hallow", "condemn", "crusade", "justice", "chastise", "rebuke", "sunbeam", "moonbeam", 
            "exorcise", "scourge", "execrate", "censure", "punish", "judgment", "radiant", "divine", "avenging", "penalize",
            "purification", "consecration", "sanctification", "righteousness", "illumination", "condemnation", "extermination", "retribution", "castigation", "vindication", 
            "inquisition", "damnation", "excommunication", "decimation", "subjugation", "persecution", "execution", "chastisement", "admonition", "proscription"
        ]
    };
        
    const enemyTypes = [
        {
        name: "INFERNAL DEVIL",
            sprites: [
            "/static/bee/images/infernal_1.png",
            "/static/bee/images/infernal_2.png",
            "/static/bee/images/infernal_3.png",
            ]
        },
        {
        name: "STYGIAN DEVIL",
            sprites: [
            "/static/bee/images/stygian_1.png",
            "/static/bee/images/stygian_2.png",
            "/static/bee/images/stygian_3.png",
            ]
        },
        {
        name: "ABYSSAL DEMON",
            sprites: [
            "/static/bee/images/abyssal_1.png",
            "/static/bee/images/abyssal_2.png",
            "/static/bee/images/abyssal_3.png",
            ]
        }
    ];

    const urlParams = new URLSearchParams(window.location.search);
    let selectedDifficultySetting = urlParams.get('difficulty') || "easy";
    
    let wordsPool = [];
    let currentWord = "";
    
    let score = 0;
    let lives = 3;
    let comboCount = 0;
    let multiplier = 1;
    let gameOver = false;
    let isTransitioning = false; 
    let isExiting = false;
    let isConfirmingRetreat = false;

    let timeLeft = 15;
    let countdownInterval = null;

    const synth = window.speechSynthesis;
    const SpeechRecognition = window.webkitSpeechRecognition || window.SpeechRecognition;
    const SpeechGrammarList = window.webkitSpeechGrammarList || window.SpeechGrammarList;
    let recognition = null;

    const validLetters = {
        "a":"a", "ay":"a", "hey":"a",
        "b":"b", "be":"b", "bee":"b",
        "c":"c", "see":"c", "sea":"c",
        "d":"d", "dee":"d",
        "e":"e", "ih":"e",
        "f":"f", "ef":"f",
        "g":"g", "jee":"g",
        "h":"h", "aitch":"h",
        "i":"i", "eye":"i",
        "j":"j", "jay":"j",
        "k":"k", "kay":"k",
        "l":"l", "el":"l",
        "m":"m", "em":"m",
        "n":"n", "en":"n",
        "o":"o", "oh":"o",
        "p":"p", "pee":"p",
        "q":"q", "queue":"q",
        "r":"r", "are":"r", "our":"r",
        "s":"s", "ess":"s",
        "t":"t", "tea":"t", "tee":"t", "chi":"t", "chee":"t",
        "u":"u", "you":"u",
        "v":"v", "vee":"v",
        "w":"w", "doubleyou":"w",
        "x":"x", "ex":"x",
        "y":"y", "why":"y",
        "z":"z", "zee":"z", "zed":"z", "zay":"z",
    };

    const wordToLetterMap = {
        "for": "f", "four": "f", "to": "t", "too": "t", "two": "t", "see": "c", "sea": "c",
        "bee": "b", "be": "b", "are": "r", "our": "r", "you": "u", "why": "y", "oh": "o", "know": "n", "no": "n"
    };

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true; 
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        if (SpeechGrammarList) {
            const grammarWords = Object.keys(validLetters);
            const jsgfGrammar = `#JSGF V1.0; grammar letters; public <letter> = ${grammarWords.join(' | ')} ;`;
            const speechRecognitionList = new SpeechGrammarList();
            speechRecognitionList.addFromString(jsgfGrammar, 1);
            recognition.grammars = speechRecognitionList;
        }
    } else {
        alert("Your browser does not support Web Speech API. Please use Google Chrome.");
    }

    function exitToMenu() {
        isExiting = true;
        gameOver = true;     
        stopTimer();                
        safelyStopRecognition();    
        if (synth && synth.speaking) {
            synth.cancel();         
        }
        window.location.href = "/"; 
    }

    function speak(text, callback) {
        if (synth.speaking) synth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.85;
        if(callback) utterance.onend = callback;
        synth.speak(utterance);
    }

    function renderHearts() {
        const heartContainer = document.getElementById('heartsDisplay');
        heartContainer.innerHTML = "";
        
        for (let i = 0; i < 3; i++) {
            let heartImg = document.createElement("img");
            heartImg.style.width = "20px";
            heartImg.style.margin = "0 3px";
            heartImg.src = i < lives ? "/static/bee/images/ui/heart_full.png" : "/static/bee/images/ui/heart_empty.png";
            heartContainer.appendChild(heartImg);
        }
    }

    function startGame() {
        wordsPool = [...difficultyWords[selectedDifficultySetting]];
        score = 0;
        lives = 3;
        gameOver = false;
        isTransitioning = false;

        comboCount = 0;
        multiplier = 1;
        updateMultiplierUI();
        document.querySelector('.container').classList.remove('theme-evoker', 'theme-warlock', 'theme-paladin', 'mana-surge');

        document.getElementById('score').innerText = score;
        renderHearts();
        document.getElementById('spellingDisplay').classList.remove('message-mode');

        setInterfaceDisabled(false);
        nextWord();
    }

    function nextWord() {
        if (gameOver) return;
        isTransitioning = false;
        setInterfaceDisabled(false);

        if (wordsPool.length === 0) {
            gameOver = true;
            isTransitioning = false;
            stopTimer();
            startListening();
            
            document.getElementById('status').innerText = "🏆 THE HORDE IS VANQUISHED!";
            document.getElementById('status').style.color = "var(--success)";
            const spellingEl = document.getElementById('spellingDisplay');
            spellingEl.classList.add('message-mode');
            spellingEl.innerText = "DUNGEON CLEARED";
            setInterfaceDisabled(true);
            return;
        }

        document.getElementById('enemyHealth').style.width = "100%";
        
        const randomEnemy = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
        const randomSprite = randomEnemy.sprites[Math.floor(Math.random() * randomEnemy.sprites.length)];
    
        document.getElementById('enemyName').innerText = randomEnemy.name;
        const enemySpriteEl = document.getElementById('enemySprite');
        enemySpriteEl.src = randomSprite;
        enemySpriteEl.style.opacity = "1";

        const randomIndex = Math.floor(Math.random() * wordsPool.length);
        currentWord = wordsPool[randomIndex];
        
        // DYNAMIC UI THEME SHIFT: Check the current active dictionary archetype
        const container = document.querySelector('.container');
        container.classList.remove('theme-evoker', 'theme-warlock', 'theme-paladin');
        
        if (archetypes.evoker.includes(currentWord)) {
            container.classList.add('theme-evoker');
        } else if (archetypes.warlock.includes(currentWord)) {
            container.classList.add('theme-warlock');
        } else if (archetypes.paladin.includes(currentWord)) {
            container.classList.add('theme-paladin');
        }

        document.getElementById('spellingDisplay').innerText = "---";
        document.getElementById('status').innerText = "Listening to the Talking Tome...";
        document.getElementById('status').style.color = "white";

        speak("The incantation is " + currentWord, () => {
            if(!gameOver && !isTransitioning) {
                document.getElementById('status').innerText = "Spell your spell! 🎙️";
                startTimer();
                startListening();
            }
        });
    }

    function repeatWord() {
        if(isTransitioning || gameOver) return;
        safelyStopRecognition(); 
        
        speak("The incantation is " + currentWord, () => {
            if(!gameOver && !isTransitioning) {
                startListening(); 
            }
        });
    }

    function clearSpelling() {
        if (gameOver || isTransitioning) return;
    
        document.getElementById('spellingDisplay').innerText = "---";
        safelyStopRecognition(true);
    }

    // Helper UI update utility
    function updateMultiplierUI() {
        const el = document.getElementById('multDisplay');
        const container = document.querySelector('.container');
        
        if (multiplier > 1) {
            el.innerText = multiplier === 3 ? `x${multiplier} SURGE!` : `x${multiplier}`;
            el.style.display = 'inline';
            el.style.color = multiplier === 3 ? 'var(--danger)' : 'var(--warning)';
        } else {
            el.style.display = 'none';
            container.classList.remove('mana-surge');
        }
    }

    function setInterfaceDisabled(disabled) {
        document.getElementById('repeatBtn').disabled = disabled;
        document.getElementById('clearBtn').disabled = disabled;
    }

    function startTimer() {
        stopTimer();
        timeLeft = 15;
        document.getElementById('timerDisplay').innerText = timeLeft;

        countdownInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timerDisplay').innerText = timeLeft;

            if (timeLeft <= 0) {
                stopTimer();
                safelyStopRecognition();
                handleIncorrectTransition("Cat got your tongue?");
            }
        }, 1000);
    }

    function stopTimer() {
        if (countdownInterval) clearInterval(countdownInterval);
    }

    function triggerGameOver() {
        gameOver = true;
        isTransitioning = false;
        stopTimer();
        startListening();
        
        setInterfaceDisabled(true);
        document.getElementById('status').innerText = "💀 YOU HAVE FALLEN";
        document.getElementById('status').style.color = "var(--danger)";
        const spellingEl = document.getElementById('spellingDisplay');
        spellingEl.classList.add('message-mode');
        spellingEl.innerText = "VITALITY DEPLETED";
        speak("A fatal mistake. Did our magical connection flicker? A misspelling perhaps? A mishap! Do not despair. Mending shattered spellcasters is my expertise. You have been resurrected. Try not to choke on your words next time.");
    }

    function startListening() {
        if (!recognition || isTransitioning) return; 
        
        try { 
            recognition.start(); 
            document.querySelector('.container').classList.add('listening');
        } catch(e) {}
    }

   function safelyStopRecognition(forceAbort = false) {
        if (recognition) {
            try { 
                if (forceAbort) {
                    recognition.abort();
                } else {
                    recognition.stop(); 
                }
            } catch(e) {}
        }
        document.querySelector('.container').classList.remove('listening');
    }

    function handleIncorrectTransition(reasonText) {
        isTransitioning = true;
        setInterfaceDisabled(true);
        lives--;
        renderHearts();
        comboCount = 0;
        multiplier = 1;
        updateMultiplierUI();

        stopTimer();
        safelyStopRecognition();

        const sprite = document.getElementById('enemySprite');
        if (sprite) {
            sprite.classList.add('monster-strike');
            setTimeout(() => { sprite.classList.remove('monster-strike'); }, 400);
        }

        document.getElementById('status').innerText = `${reasonText} The true incantation was: ${currentWord.toUpperCase()}`;
        document.getElementById('status').style.color = "var(--danger)";
    
        speak(`Cat got your tongue? The incantation was ${currentWord}`, () => {
            if (lives <= 0) {
                setTimeout(triggerGameOver, 1000);
            } else {
                document.getElementById('enemySprite').style.opacity = "0";
                setTimeout(nextWord, 600);
            }
        });
    }

   function promptRetreatConfirmation() {
        isConfirmingRetreat = true;
        stopTimer();
        safelyStopRecognition(true);
        
        document.getElementById('retreatModal').style.display = 'flex';
        
        if (typeof speak === 'function') {
            speak("Are you sure you want to abandon this battle?", () => {
                if (isConfirmingRetreat && !gameOver) {
                    startListening(); 
                }
            });
        } else {
            startListening();
        }
    }
    
    function cancelRetreat() {
        isConfirmingRetreat = false;
        document.getElementById('retreatModal').style.display = 'none';
        safelyStopRecognition(true);
        
        if (!gameOver) {
            startTimer();
            startListening();
        }
        
        console.log("⚔️ Retreat cancelled. Back to battle!");
    }

    if (recognition) {
       recognition.onresult = function(event) {
            let lastResultIndex = event.results.length - 1;
            let rawTranscript = event.results[lastResultIndex][0].transcript.trim().toLowerCase();
            
            if (isConfirmingRetreat) {
                if (rawTranscript.includes("yes")) {
                    console.log("🗣️ Voice Command: YES (Retreat Confirmed)");
                    exitToMenu();
                    return;
                } else if (rawTranscript.includes("no")) {
                    console.log("🗣️ Voice Command: NO (Retreat Canceled)");
                    cancelRetreat();
                    return;
                }
                return;
            }

            if (rawTranscript.includes("retreat")) {
                console.log("🗣️ Voice Command Triggered: RETREAT");
                if (gameOver) {
                    exitToMenu();
                } else {
                    promptRetreatConfirmation();
                }
                return; 
            }
    
            if (isTransitioning || gameOver) return;

            if (rawTranscript.includes("recall")) {
                console.log("🗣️ Voice Command Triggered: RECALL");
                repeatWord();
                return; 
            }
            if (rawTranscript.includes("dispel")) {
                console.log("🗣️ Voice Command Triggered: DISPEL");
                clearSpelling();
                return; 
            }
            
            let liveTotalSpelling = "";

            for (let i = 0; i < event.results.length; i++) {
                let chunk = event.results[i][0].transcript.toLowerCase().trim();
                let spokenParts = chunk.replace(/[^a-zA-Z -]/g, "").split(/[\s-]+/);

                spokenParts.forEach(part => {
                    if (!part) return;
                    
                    if (validLetters[part]) {
                        liveTotalSpelling += validLetters[part];
                    } else if (wordToLetterMap[part]) {
                        liveTotalSpelling += wordToLetterMap[part];
                    } else {
                        if (part.length === 1 && part >= 'a' && part <= 'z') {
                            liveTotalSpelling += part;
                        }
                    }
                });
            }
            
            liveTotalSpelling = liveTotalSpelling.trim();

            if (liveTotalSpelling.length > 0) {
                document.getElementById('spellingDisplay').innerText = liveTotalSpelling.split("").join(" ");
            }

            if (liveTotalSpelling === currentWord) {
                isTransitioning = true; 
                stopTimer();
                safelyStopRecognition(true);
                setInterfaceDisabled(true);

                comboCount++;
                if (comboCount >= 6) {
                    multiplier = 3;
                    document.querySelector('.container').classList.add('mana-surge');
                } else if (comboCount >= 3) {
                    multiplier = 2;
                } else {
                    multiplier = 1;
                }
                updateMultiplierUI();
            
                score += multiplier;
                document.getElementById('score').innerText = score;
                
                document.getElementById('status').innerText = "✨ THE MONSTER IS DEFEATED!";
                document.getElementById('status').style.color = "var(--success)";

                const sprite = document.getElementById('enemySprite');
                if (sprite) {
                    sprite.classList.add('monster-hit');
                    setTimeout(() => { sprite.classList.remove('monster-hit'); }, 500);
                }
                document.getElementById('enemyHealth').style.width = "0%";

                submitScoreToDjango(score);
                wordsPool = wordsPool.filter(w => w !== currentWord);
                
                speak("A fatal blow!", () => {
                    document.getElementById('enemySprite').style.opacity = "0";
                    setTimeout(nextWord, 600); 
                });
                return; 
            }
            
            // EXCEEDED LENGTH FAILURE GATECHECK
            if (liveTotalSpelling.length >= currentWord.length && liveTotalSpelling !== currentWord) {
                isTransitioning = true;
                stopTimer();
                safelyStopRecognition(true); 
                handleIncorrectTransition("The runes shattered!");
            }
        };

        recognition.onstart = function() {
            if (!isTransitioning && !isConfirmingRetreat && !gameOver) {
                document.querySelector('.container').classList.add('listening');
            }
        };
    
        recognition.onend = function () {
            if (isExiting) return;
        
            if (gameOver) {
                try { recognition.start(); } catch(e) {}
                return;
            }
            
            // Call the wrapper function to reboot the engine AND restore the .listening class to the container
            if (!isTransitioning && !isConfirmingRetreat) {
                startListening();
            }
        };
        
        recognition.onerror = function(e) {
            console.error("Speech error processing: ", e.error);
            
            // Check for terminal security or hardware blocks
            if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
                gameOver = true;
                stopTimer();
                setInterfaceDisabled(true);
                document.getElementById('status').innerText = "🎙️ Connection Lost: Microphone Access Denied.";
                document.getElementById('status').style.color = "var(--danger)";
            }
            
            safelyStopRecognition();
        };
    }

    function submitScoreToDjango(currentScore) {
        const currentDifficulty = typeof selectedDifficultySetting !== 'undefined' ? selectedDifficultySetting : 'easy';
        const csrfEl = document.querySelector('[name=csrfmiddlewaretoken]');
        if (!csrfEl) {
            console.error("Security Halt: CSRF element token verification missing from current DOM context.");
            return;
        }
        const csrftoken = csrfEl.value;

        fetch('/api/save-score/', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'X-CSRFToken': csrftoken 
            },
            body: JSON.stringify({
                score: currentScore,            
                difficulty: currentDifficulty   
            })
        })
        .then(response => {
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            return response.json();
        })
        .then(data => {
            if (data.status === 'success') {
                console.log("✨ Score locked into PostgreSQL successfully!");
            } else {
                console.error("Database save failed:", data.message);
            }
        })
        .catch(error => {
            console.error("Error reporting score to server:", error);
        });
    }

    window.onload = function() {
        startGame();
    };
</script>
